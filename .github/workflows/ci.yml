name: CI

# Every push to main and every pull request runs the same checks you would run by hand:
# the API tests, the web checks and build, and a build of the production images.
# A red build means "do not deploy".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (tests, security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    env:
      # A throwaway key so encryption works in tests (two-factor secrets are encrypted). Not a real secret.
      APP_KEY: base64:Y2ktdGVzdC1rZXktZG8tbm90LXVzZS1pbi1wcm9kISE=
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gd, zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=512M

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      # Laravel looks for an .env file at start-up and the test runner reports a warning for every test if it is
      # missing. Every real setting here comes from the job's environment and phpunit.xml, so an empty file is right.
      - name: Create an empty .env
        run: touch .env

      - name: Known vulnerabilities in PHP packages
        run: composer audit --no-interaction

      # phpunit.xml pins the test database to in-memory SQLite. The suite also reads design/ and web/
      # (the palette checks), which is why the whole repository is checked out above.
      - name: Tests
        run: php artisan test

  web:
    name: Web (types, lint, tests, build, security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (includes pre-rendering the public pages)
        run: npm run build

      - name: Public site checks (canonical links, sitemap, no private page indexable)
        run: npm run test:seo

      - name: Known vulnerabilities in browser packages (production only)
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Production images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds only (nothing is pushed). Catches a Dockerfile that no longer builds before deploy day.
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Web server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: api-nginx
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Production compose file is valid
        run: ENV_FILE=api/.env.production.example REDIS_PASSWORD=ci docker compose --env-file api/.env.production.example -f docker-compose.prod.yml config --quiet

  scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax and common mistakes
        run: |
          for f in deploy/aws/*.sh docker/php/entrypoint.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/aws/*.sh docker/php/entrypoint.sh
