name: 'Two-factor authentication'
description: |-

  Lets a signed-in person protect their own account with an authenticator app
  (Google Authenticator, Microsoft Authenticator, 1Password, Authy…). Every step
  asks for the current password again, so a stolen session token alone can't
  switch protection on or off. Wrong passwords and wrong codes here count toward
  the same lockout as at sign-in.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/two-factor/setup
    metadata:
      custom: []
      groupName: 'Two-factor authentication'
      groupDescription: |-

        Lets a signed-in person protect their own account with an authenticator app
        (Google Authenticator, Microsoft Authenticator, 1Password, Authy…). Every step
        asks for the current password again, so a stolen session token alone can't
        switch protection on or off. Wrong passwords and wrong codes here count toward
        the same lockout as at sign-in.
      subgroup: ''
      subgroupDescription: ''
      title: 'Start two-factor setup'
      description: |-
        Returns a new secret and the `otpauth://` link to show as a QR code. Two-factor is
        not active yet: call `/auth/two-factor/confirm` with a code from the app first.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      password:
        custom: []
        name: password
        description: 'The current password.'
        required: true
        example: Secret123!word
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      password: Secret123!word
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"success": true, "message": "Scan the code, then confirm with a code from your app.", "data": {"secret": "JBSWY3DPEHPK3PXP", "otpauth_url": "otpauth://totp/DeskZeal:me%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=DeskZeal"}}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"success": false, "message": "Two-factor authentication is already on. Turn it off first to set it up again."}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/two-factor/confirm
    metadata:
      custom: []
      groupName: 'Two-factor authentication'
      groupDescription: |-

        Lets a signed-in person protect their own account with an authenticator app
        (Google Authenticator, Microsoft Authenticator, 1Password, Authy…). Every step
        asks for the current password again, so a stolen session token alone can't
        switch protection on or off. Wrong passwords and wrong codes here count toward
        the same lockout as at sign-in.
      subgroup: ''
      subgroupDescription: ''
      title: 'Turn two-factor on'
      description: |-
        Confirms setup with the first 6-digit code from the app. Returns the recovery
        codes **once**; each works a single time if the phone is lost.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      code:
        custom: []
        name: code
        description: ''
        required: true
        example: '123456'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      code: '123456'
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"success": true, "message": "Two-factor authentication is on.", "data": {"recovery_codes": ["ab12c-d34ef", "gh56i-j78kl"]}}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"success": false, "message": "Validation failed.", "errors": {"code": ["The code is incorrect or has expired."]}}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/two-factor/disable
    metadata:
      custom: []
      groupName: 'Two-factor authentication'
      groupDescription: |-

        Lets a signed-in person protect their own account with an authenticator app
        (Google Authenticator, Microsoft Authenticator, 1Password, Authy…). Every step
        asks for the current password again, so a stolen session token alone can't
        switch protection on or off. Wrong passwords and wrong codes here count toward
        the same lockout as at sign-in.
      subgroup: ''
      subgroupDescription: ''
      title: 'Turn two-factor off'
      description: ''
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      password:
        custom: []
        name: password
        description: 'The current password.'
        required: true
        example: Secret123!word
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      code:
        custom: []
        name: code
        description: 'A current 6-digit code.'
        required: false
        example: '123456'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      recovery_code:
        custom: []
        name: recovery_code
        description: 'A recovery code, instead of `code`.'
        required: false
        example: ab12c-d34ef
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      password: Secret123!word
      code: '123456'
      recovery_code: ab12c-d34ef
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"success": true, "message": "Two-factor authentication is off.", "data": null}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/two-factor/recovery-codes
    metadata:
      custom: []
      groupName: 'Two-factor authentication'
      groupDescription: |-

        Lets a signed-in person protect their own account with an authenticator app
        (Google Authenticator, Microsoft Authenticator, 1Password, Authy…). Every step
        asks for the current password again, so a stolen session token alone can't
        switch protection on or off. Wrong passwords and wrong codes here count toward
        the same lockout as at sign-in.
      subgroup: ''
      subgroupDescription: ''
      title: 'Get new recovery codes'
      description: 'Replaces all recovery codes. The old ones stop working.'
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      code:
        custom: []
        name: code
        description: 'A current 6-digit code.'
        required: true
        example: '123456'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'The current password.'
        required: true
        example: Secret123!word
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      code: '123456'
      password: Secret123!word
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"success": true, "message": "New recovery codes created. The old ones no longer work.", "data": {"recovery_codes": ["ab12c-d34ef"]}}'
        headers: []
        description: ''
    responseFields: []
    auth:
