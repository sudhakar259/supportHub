      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                razorpay_order_id:
                  type: string
                  description: 'The order id the invoice was issued with.'
                  example: order_Lx1234abcd
                razorpay_payment_id:
                  type: string
                  description: 'The payment id returned by Razorpay Checkout.'
                  example: pay_Lx1234abcd
                razorpay_signature:
                  type: string
                  description: 'The signature returned by Razorpay Checkout.'
                  example: architecto
              required:
                - razorpay_order_id
                - razorpay_payment_id
                - razorpay_signature
