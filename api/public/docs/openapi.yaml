openapi: 3.0.3
info:
  title: 'SupportHub API Documentation'
  description: 'REST API for SupportHub — ticket creation and lifecycle, routing, SLA, notifications, and administration. Backs the web, mobile and any third-party clients equally; this document is the contract.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nToken-based authentication shared by the web, mobile and third-party\nclients. All endpoints here are unauthenticated except /auth/logout,\n/auth/me and the email verification resend endpoint, which require a\nBearer token obtained from /auth/login or /auth/register."
  -
    name: Users
    description: "\nInternal staff accounts (agents, senior agents, department managers,\nadministrators). Customer accounts are managed under the Customers\ngroup instead."
  -
    name: 'Roles & Permissions'
    description: "\nThe 5 built-in roles (Administrator, Department Manager, Senior Agent,\nAgent, Customer) cover the standard workforce shape; additional\ncustom roles can be created here and assigned any subset of the\npermissions listed by GET /permissions. The Administrator and\nCustomer roles cannot be deleted."
  -
    name: Customers
    description: "\nCustomer profiles. Every customer is backed by a `User` record with\nthe `Customer` role; this resource manages the additional profile\nfields (company, customer type) layered on top of it."
  -
    name: Departments
    description: "\nDepartments own tickets, staff and category groupings, and are the\nunit that routing rules and SLA policies can be scoped to."
  -
    name: Tickets
    description: "\nThe core ticket resource. Visibility is scoped automatically: a\ncustomer only ever sees their own tickets; non-administrator staff\nonly see tickets in their department(s) or assigned directly to\nthem. Administrators see everything."
  -
    name: 'Ticket Messages'
    description: "\nCustomer messages, agent replies and internal notes on a ticket.\nInternal notes are never returned to a customer: this is enforced by\nexcluding them from the query entirely for any caller without the\ntickets.view_internal_notes permission, not just by hiding a field."
  -
    name: 'Ticket Attachments'
    description: "\nFiles are validated on MIME type, extension and size at upload time\n(see StoreTicketMessageRequest / this controller's own rules) and\nare never served directly from public storage — every download goes\nthrough the authorization check in TicketAttachmentPolicy, which\nalso denies customers access to a file attached to an internal note."
  -
    name: Categories
    description: "\nTicket categories and subcategories. A \"subcategory\" is simply another\nrow with parent_id set — see the architecture docs for why this\nreplaces a separate child-categories table."
  -
    name: Statuses
    description: "\nThe seven built-in statuses (Open, In Progress, Pending, Escalated,\nResolved, Closed, Reopened) drive the ticket status workflow (see\ndocs/ticket-workflow.md) and are matched by slug, not id — additional\nstatuses can be added here for labeling/reporting but will not\nautomatically participate in transition validation."
  -
    name: Priorities
    description: "\nTicket priorities. `level` is a numeric ordering used by routing\nrules and reporting (higher = more urgent)."
  -
    name: Routing
    description: "\nTicket routing rules, evaluated in `priority` order (lowest first)\nagainst every newly-created ticket. See docs/routing.md for the full\ncondition/action schema and worked examples."
  -
    name: SLA
    description: "\nSLA policies define first-response and resolution deadlines. The\nmost specific match wins when a ticket's SLA is calculated: priority\n+ department, falling back to a department-less default for that\npriority — see CalculateSlaAction and docs/ticket-workflow.md."
  -
    name: Notifications
    description: "\nEvery user manages their own notification preferences — there is no\nadmin override of another user's preferences, since they describe a\npersonal inbox choice, not a permission."
  -
    name: Reports
    description: "\nAggregate reporting. These run live queries rather than against a\npre-aggregated table — acceptable at the data volumes a support\ndesk accumulates, but the first thing to revisit if that changes."
  -
    name: 'Audit Logs'
    description: "\nSystem-wide, read-only audit trail. Distinct from a ticket's own\nactivity feed (GET /tickets/{ticket} includes its activities) —\nthis covers every auditable action across the whole application for\ncompliance review."
  -
    name: Settings
    description: "\nSystem-wide configuration key/value pairs. Anyone authenticated can\nread the subset marked is_public (e.g. a \"support hours\" display\nstring); the full set, and all writes, require settings.manage."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token from `POST /api/v1/auth/login` or `POST /api/v1/auth/register`, then send it as `Authorization: Bearer {token}` on every subsequent request.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register (customer self-service)'
      operationId: registercustomerSelfService
      description: "Creates a new Customer-role account and an associated customer\nprofile, then returns a Bearer token. A verification email is\nqueued automatically."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Registration successful.'
                  data:
                    user:
                      id: 42
                      name: 'Jamie Rivera'
                      email: jamie@example.com
                      roles:
                        - Customer
                    token: 1|abcdef123456...
                    token_type: Bearer
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Registration successful.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 42
                          name:
                            type: string
                            example: 'Jamie Rivera'
                          email:
                            type: string
                            example: jamie@example.com
                          roles:
                            type: array
                            example:
                              - Customer
                            items:
                              type: string
                      token:
                        type: string
                        example: 1|abcdef123456...
                      token_type:
                        type: string
                        example: Bearer
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The user's full name."
                  example: 'Jamie Rivera'
                email:
                  type: string
                  description: 'A unique email address.'
                  example: jamie@example.com
                password:
                  type: string
                  description: 'Minimum 8 characters.'
                  example: Secret123!
                phone:
                  type: string
                  description: "The user's phone number."
                  example: +1-555-0100
                  nullable: true
                company_name:
                  type: string
                  description: 'Optional company name for business customers.'
                  example: 'Acme Corp'
                  nullable: true
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: Secret123!
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: "Exchanges email/password credentials for a Sanctum Bearer token.\nPass a `device_name` so multiple tokens (web, iOS, Android) can be\nmanaged and revoked independently per device."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Login successful.'
                  data:
                    user:
                      id: 1
                      name: 'System Administrator'
                      email: admin@supporthub.test
                      roles:
                        - Administrator
                    token: 1|abcdef123456...
                    token_type: Bearer
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Login successful.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'System Administrator'
                          email:
                            type: string
                            example: admin@supporthub.test
                          roles:
                            type: array
                            example:
                              - Administrator
                            items:
                              type: string
                      token:
                        type: string
                        example: 1|abcdef123456...
                      token_type:
                        type: string
                        example: Bearer
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'This account has been deactivated.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'This account has been deactivated.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    email:
                      - 'The provided credentials are incorrect.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The provided credentials are incorrect.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: admin@supporthub.test
                password:
                  type: string
                  description: ''
                  example: password
                device_name:
                  type: string
                  description: 'Identifies the issued token, e.g. "iphone-15".'
                  example: web-browser
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Forgot password'
      operationId: forgotPassword
      description: "Sends a password reset link to the given email if an account\nexists for it. Always returns the same generic success message\nregardless of whether the email is registered, to avoid leaking\nwhich addresses have accounts."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'If an account exists for that email, a password reset link has been sent.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'If an account exists for that email, a password reset link has been sent.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: admin@supporthub.test
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: "Completes a password reset using the token emailed by\n/auth/forgot-password."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Password has been reset successfully.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Password has been reset successfully.'
                  data:
                    type: string
                    example: null
                    nullable: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    email:
                      - 'This password reset token is invalid or has expired.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'This password reset token is invalid or has expired.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The token from the reset email.'
                  example: 9f8e7d6c5b4a
                email:
                  type: string
                  description: ''
                  example: admin@supporthub.test
                password:
                  type: string
                  description: 'Minimum 8 characters.'
                  example: NewSecret123!
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: NewSecret123!
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  '/api/v1/auth/email/verify/{id}/{hash}':
    get:
      summary: 'Verify email'
      operationId: verifyEmail
      description: "Consumes the signed link from the verification email. `id` and\n`hash` come from that link and are not meant to be constructed\nby hand."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Email verified successfully.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Email verified successfully.'
                  data:
                    type: string
                    example: null
                    nullable: true
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid verification link.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid verification link.'
      tags:
        - Authentication
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The user id from the verification link.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: hash
        description: "The sha1 hash of the user's email from the verification link."
        example: 5f4dcc3b5aa765d61d8327deb882cf99
        required: true
        schema:
          type: string
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: "Revokes the Bearer token used to make this request. Other tokens\nissued to the same user (other devices) remain valid."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Logged out successfully.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Logged out successfully.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentication
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: "Returns the authenticated user's profile, roles, permissions and\n(for customers) their customer profile."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Request successful.'
                  data:
                    id: 1
                    name: 'System Administrator'
                    email: admin@supporthub.test
                    roles:
                      - Administrator
                    permissions:
                      - tickets.view
                      - ...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Request successful.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'System Administrator'
                      email:
                        type: string
                        example: admin@supporthub.test
                      roles:
                        type: array
                        example:
                          - Administrator
                        items:
                          type: string
                      permissions:
                        type: array
                        example:
                          - tickets.view
                          - ...
                        items:
                          type: string
      tags:
        - Authentication
  /api/v1/auth/email/verification-notification:
    post:
      summary: 'Resend email verification'
      operationId: resendEmailVerification
      description: "Resends the verification email if the authenticated user's address\nis not yet verified."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: ''
                    type: object
                    example:
                      success: true
                      message: 'Verification link sent.'
                      data: null
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: 'Verification link sent.'
                      data:
                        type: string
                        example: null
                        nullable: true
                  -
                    description: ''
                    type: object
                    example:
                      success: true
                      message: 'Email already verified.'
                      data: null
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: 'Email already verified.'
                      data:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Authentication
  /api/v1/users:
    get:
      summary: 'List users'
      operationId: listUsers
      description: ''
      parameters:
        -
          in: query
          name: 'filter[name]'
          description: 'Partial name match.'
          example: Alex
          required: false
          schema:
            type: string
            description: 'Partial name match.'
            example: Alex
        -
          in: query
          name: 'filter[email]'
          description: 'Partial email match.'
          example: alex@
          required: false
          schema:
            type: string
            description: 'Partial email match.'
            example: alex@
        -
          in: query
          name: 'filter[is_active]'
          description: ''
          example: 'true'
          required: false
          schema:
            type: string
            description: ''
            example: 'true'
        -
          in: query
          name: 'filter[role]'
          description: 'Exact role name.'
          example: Agent
          required: false
          schema:
            type: string
            description: 'Exact role name.'
            example: Agent
        -
          in: query
          name: sort
          description: 'Sort by name or created_at.'
          example: name
          required: false
          schema:
            type: string
            description: 'Sort by name or created_at.'
            example: name
        -
          in: query
          name: per_page
          description: 'Items per page (max 100).'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Items per page (max 100).'
            example: 25
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Request successful.'
                  data:
                    -
                      id: 2
                      name: 'Alex Agent'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Request successful.'
                  data:
                    type: array
                    example:
                      -
                        id: 2
                        name: 'Alex Agent'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: 'Alex Agent'
      tags:
        - Users
    post:
      summary: 'Create a staff user'
      operationId: createAStaffUser
      description: "Creates an internal account (agent, senior agent, department\nmanager or administrator) with a single role and optional\ndepartment memberships."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'User created successfully.'
                  data:
                    id: 9
                    name: 'Alex Agent'
                    roles:
                      - Agent
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User created successfully.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 9
                      name:
                        type: string
                        example: 'Alex Agent'
                      roles:
                        type: array
                        example:
                          - Agent
                        items:
                          type: string
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: 'Alex Agent'
                email:
                  type: string
                  description: ''
                  example: alex@supporthub.test
                password:
                  type: string
                  description: ''
                  example: Secret123!
                phone:
                  type: string
                  description: ''
                  example: +1-555-0100
                  nullable: true
                role:
                  type: string
                  description: 'One of Agent, Senior Agent, Department Manager, Administrator.'
                  example: Agent
                department_ids:
                  type: array
                  description: 'Departments to assign this user to.'
                  example:
                    - 1
                    - 2
                  items:
                    type: integer
                password_confirmation:
                  type: string
                  description: ''
                  example: Secret123!
              required:
                - name
                - email
                - password
                - role
                - password_confirmation
  '/api/v1/users/{user_id}':
    get:
      summary: 'Get a user'
      operationId: getAUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Request successful.'
                  data:
                    id: 2
                    name: 'Alex Agent'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Request successful.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Alex Agent'
      tags:
        - Users
    put:
      summary: 'Update a user'
      operationId: updateAUser
      description: "Users may update their own name/phone/timezone; only holders of\n`users.update` may change another user's record or flip\n`is_active`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'User updated successfully.'
                  data:
                    id: 2
                    name: 'Alex Agent'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User updated successfully.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Alex Agent'
      tags:
        - Users
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: 'Alex Agent'
                email:
                  type: string
                  description: ''
                  example: alex@supporthub.test
                phone:
                  type: string
                  description: ''
                  example: +1-555-0199
                  nullable: true
                timezone:
                  type: string
                  description: 'Must not be greater than 64 characters.'
                  example: Europe/Dublin
                is_active:
                  type: boolean
                  description: 'Requires users.update.'
                  example: true
    delete:
      summary: 'Deactivate/delete a user'
      operationId: deactivatedeleteAUser
      description: "Soft-deletes the account and revokes all of its API tokens.\nAn administrator cannot delete their own account."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'User deleted successfully.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User deleted successfully.'
                  data:
                    type: string
                    example: null
                    nullable: true
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'You do not have permission to perform this action.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'You do not have permission to perform this action.'
      tags:
        - Users
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/users/{user_id}/roles':
    put:
      summary: "Sync a user's roles"
      operationId: syncAUsersRoles
      description: "Replaces the user's role assignments with the given list.\nRequires `roles.manage`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Roles updated successfully.'
                  data:
                    id: 2
                    roles:
                      - 'Senior Agent'
                properties:
                  success:
