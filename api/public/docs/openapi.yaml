  /api/v1/tenants/register:
    post:
      summary: 'Register a new organization'
      operationId: registerANewOrganization
      description: "Creates the tenant, subscribes it to the given plan (the free\nStarter plan if omitted), provisions its default roles/ticket\nstatuses/priorities, and creates the owner account. Starter-plan\nsignups are active immediately; any paid plan starts a 14-day\ntrial (no payment is collected here — billing integration is out\nof scope for this API)."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Organization registered successfully.'
                  data:
                    tenant:
                      id: 7
                      name: 'Acme Corp'
                      slug: acme-corp
                      status: active
                    user:
                      id: 42
                      name: 'Jamie Rivera'
                      email: jamie@acme.com
                      roles:
                        - Administrator
                    token: 1|abcdef123456...
                    token_type: Bearer
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Organization registered successfully.'
                  data:
                    type: object
                    properties:
                      tenant:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 7
                          name:
                            type: string
                            example: 'Acme Corp'
                          slug:
                            type: string
                            example: acme-corp
                          status:
                            type: string
                            example: active
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 42
                          name:
                            type: string
                            example: 'Jamie Rivera'
                          email:
                            type: string
                            example: jamie@acme.com
                          roles:
                            type: array
                            example:
                              - Administrator
                            items:
                              type: string
                      token:
                        type: string
                        example: 1|abcdef123456...
                      token_type:
                        type: string
                        example: Bearer
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    tenant_slug:
                      - 'The tenant slug has already been taken.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      tenant_slug:
                        type: array
                        example:
                          - 'The tenant slug has already been taken.'
                        items:
                          type: string
      tags:
        - 'Tenant Registration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_name:
                  type: string
                  description: "The organization's display name."
                  example: 'Acme Corp'
                tenant_slug:
                  type: string
                  description: 'Globally unique, used in the `tenant` field of /auth/login and /auth/register.'
                  example: acme-corp
                owner_name:
                  type: string
                  description: ''
                  example: 'Jamie Rivera'
                owner_email:
                  type: string
                  description: ''
                  example: jamie@acme.com
                owner_password:
                  type: string
                  description: 'Minimum 10 characters, including upper and lower case, a number, and a symbol.'
                  example: Secret123!word$9
                plan:
                  type: string
                  description: 'The membership plan slug. Defaults to "starter".'
                  example: professional
                phone:
                  type: string
                  description: ''
                  example: +1-555-0100
                  nullable: true
                website:
                  type: string
                  description: ''
                  example: 'https://acme.com'
                  nullable: true
                country:
                  type: string
                  description: 'ISO 3166-1 alpha-2.'
                  example: US
                  nullable: true
                timezone:
                  type: string
                  description: ''
                  example: America/New_York
                  nullable: true
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'y'
                  nullable: true
                owner_password_confirmation:
                  type: string
                  description: 'Must match owner_password.'
                  example: Secret123!word$9
              required:
                - tenant_name
                - tenant_slug
                - owner_name
                - owner_email
                - owner_password
                - owner_password_confirmation
      security: []
