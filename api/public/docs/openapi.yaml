  /api/v1/subscription/payments/verify:
    post:
      summary: 'Confirm a payment'
      operationId: confirmAPayment
      description: "Called by the browser after Razorpay Checkout succeeds. The signature\nis checked with the key secret; an unsigned or mismatched payment is\nrejected and the invoice stays pending."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
