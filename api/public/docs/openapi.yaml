  '/api/v1/users/{user_id}/impersonate':
    post:
      summary: 'Login as a user'
      operationId: loginAsAUser
      description: "Lets an administrator (`users.impersonate`) act as another user in the\nsame tenant to see exactly what they see. Returns a short-lived Bearer\ntoken for that user; the administrator's own token is untouched, so the\nclient can switch back by discarding this one (`POST /auth/logout` with\nit). Not allowed on yourself, inactive users, other administrators, or\nfrom inside an impersonation session. Every use is written to the audit\nlog as `user.impersonated`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Now logged in as the selected user.'
                  data:
                    user:
                      id: 5
                    token: 2|abc...
                    token_type: Bearer
                    expires_at: '2026-10-09T20:00:00+00:00'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Now logged in as the selected user.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 5
                      token:
                        type: string
                        example: 2|abc...
                      token_type:
                        type: string
                        example: Bearer
                      expires_at:
                        type: string
                        example: '2026-10-09T20:00:00+00:00'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'You do not have permission to perform this action.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'You do not have permission to perform this action.'
      tags:
        - Users
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: user
        description: 'The user to act as.'
        example: 5
        required: true
        schema:
          type: integer
