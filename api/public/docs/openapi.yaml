  '/api/v1/customers/{customer_id}/erase':
    post:
      summary: "Erase a customer's personal data"
      operationId: eraseACustomersPersonalData
      description: "**Irreversible.** Anonymizes the customer everywhere their identity is stored (account,\ncustomer record, audit entries, the inbound-email log) and signs them out. With\n`redact_content` (the default) it also removes the text of their tickets, every message\nand all attachments; with `false` the ticket text is kept for your records and only the\nperson stops being identifiable. Requires `customers.erase`, and the customer's email\ntyped back as confirmation."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Customer data erased.'
                  data:
                    tickets: 3
                    messages_redacted: 11
                    attachments_removed: 2
                    redacted_content: true
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Customer data erased.'
                  data:
                    type: object
                    properties:
                      tickets:
                        type: integer
                        example: 3
                      messages_redacted:
                        type: integer
                        example: 11
                      attachments_removed:
                        type: integer
                        example: 2
                      redacted_content:
                        type: boolean
                        example: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    confirm_email:
                      - 'The email does not match this customer.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      confirm_email:
                        type: array
                        example:
                          - 'The email does not match this customer.'
                        items:
                          type: string
      tags:
        - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_email:
                  type: string
                  description: "The customer's current email address, to confirm this is the right person."
                  example: jamie@example.com
                redact_content:
                  type: boolean
                  description: 'Also remove ticket text, messages and attachments. Defaults to true.'
                  example: true
              required:
                - confirm_email
    parameters:
      -
        in: path
        name: customer_id
        description: 'The ID of the customer.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: customer
        description: ''
        example: 4
        required: true
        schema:
          type: integer
