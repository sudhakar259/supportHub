  /api/v1/auth/two-factor/setup:
    post:
      summary: 'Start two-factor setup'
      operationId: startTwoFactorSetup
      description: "Returns a new secret and the `otpauth://` link to show as a QR code. Two-factor is\nnot active yet: call `/auth/two-factor/confirm` with a code from the app first."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Scan the code, then confirm with a code from your app.'
                  data:
                    secret: JBSWY3DPEHPK3PXP
                    otpauth_url: 'otpauth://totp/DeskNu:me%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=DeskNu'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Scan the code, then confirm with a code from your app.'
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                        example: JBSWY3DPEHPK3PXP
                      otpauth_url:
                        type: string
                        example: 'otpauth://totp/DeskNu:me%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=DeskNu'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Two-factor authentication is already on. Turn it off first to set it up again.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Two-factor authentication is already on. Turn it off first to set it up again.'
      tags:
        - 'Two-factor authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: 'The current password.'
                  example: Secret123!word
              required:
                - password
  /api/v1/auth/two-factor/confirm:
    post:
      summary: 'Turn two-factor on'
      operationId: turnTwoFactorOn
      description: "Confirms setup with the first 6-digit code from the app. Returns the recovery\ncodes **once**; each works a single time if the phone is lost."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Two-factor authentication is on.'
                  data:
                    recovery_codes:
                      - ab12c-d34ef
                      - gh56i-j78kl
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Two-factor authentication is on.'
                  data:
                    type: object
                    properties:
                      recovery_codes:
                        type: array
                        example:
                          - ab12c-d34ef
                          - gh56i-j78kl
                        items:
                          type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    code:
                      - 'The code is incorrect or has expired.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      code:
                        type: array
                        example:
                          - 'The code is incorrect or has expired.'
                        items:
                          type: string
      tags:
        - 'Two-factor authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: ''
                  example: '123456'
              required:
                - code
  /api/v1/auth/two-factor/disable:
    post:
      summary: 'Turn two-factor off'
      operationId: turnTwoFactorOff
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Two-factor authentication is off.'
