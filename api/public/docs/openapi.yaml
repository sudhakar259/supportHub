                          type: string
                          example: 'https://example.com/hooks'
                        events:
                          type: array
                          example:
                            - ticket.created
                          items:
                            type: string
      tags:
        - Webhooks
    post:
      summary: 'Create a webhook'
      operationId: createAWebhook
      description: "The secret is returned exactly once, here — it is encrypted at\nrest and this is the only response that ever includes it in\nplain text. Use it to verify the X-Webhook-Signature header on\neach delivery."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Webhook created successfully.'
                  data:
                    id: 1
                    name: 'Ticket sync'
                    url: 'https://example.com/webhooks/desknu'
                    secret: whsec_...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Webhook created successfully.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Ticket sync'
                      url:
                        type: string
                        example: 'https://example.com/webhooks/desknu'
                      secret:
                        type: string
                        example: whsec_...
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: 'Ticket sync'
                url:
                  type: string
                  description: 'Must not point to a local/private address.'
                  example: 'https://example.com/webhooks/desknu'
                events:
                  type: array
                  description: 'One or more of ticket.created, ticket.updated, ticket.assigned, ticket.replied, ticket.status_changed, ticket.resolved, ticket.closed, ticket.reopened.'
                  example:
                    - ticket.created
                    - ticket.status_changed
                  items:
                    type: string
                is_active:
                  type: boolean
                  description: 'Defaults to true.'
                  example: true
              required:
                - name
                - url
                - events
