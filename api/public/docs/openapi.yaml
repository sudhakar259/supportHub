openapi: 3.0.3
info:
  title: 'DeskNu API Documentation'
  description: 'REST API for DeskNu — ticket creation and lifecycle, routing, SLA, notifications, and administration. Backs the web, mobile and any third-party clients equally; this document is the contract.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8082'
tags:
  -
    name: Authentication
    description: "\nToken-based authentication shared by the web, mobile and third-party\nclients. All endpoints here are unauthenticated except /auth/logout,\n/auth/me and the email verification resend endpoint, which require a\nBearer token obtained from /auth/login or /auth/register."
  -
    name: Users
    description: "\nInternal staff accounts (agents, senior agents, department managers,\nadministrators). Customer accounts are managed under the Customers\ngroup instead."
  -
    name: 'Roles & Permissions'
    description: "\nThe 5 built-in roles (Administrator, Department Manager, Senior Agent,\nAgent, Customer) cover the standard workforce shape; additional\ncustom roles can be created here and assigned any subset of the\npermissions listed by GET /permissions. The Administrator and\nCustomer roles cannot be deleted."
  -
    name: Customers
    description: "\nCustomer profiles. Every customer is backed by a `User` record with\nthe `Customer` role; this resource manages the additional profile\nfields (company, customer type) layered on top of it."
  -
    name: Departments
    description: "\nDepartments own tickets, staff and category groupings, and are the\nunit that routing rules and SLA policies can be scoped to."
  -
    name: Tickets
    description: "\nThe core ticket resource. Visibility is scoped automatically: a\ncustomer only ever sees their own tickets; non-administrator staff\nonly see tickets in their department(s) or assigned directly to\nthem. Administrators see everything."
  -
    name: 'Ticket Messages'
    description: "\nCustomer messages, agent replies and internal notes on a ticket.\nInternal notes are never returned to a customer: this is enforced by\nexcluding them from the query entirely for any caller without the\ntickets.view_internal_notes permission, not just by hiding a field."
  -
    name: 'Ticket Attachments'
    description: "\nFiles are validated on MIME type, extension and size at upload time\n(see StoreTicketMessageRequest / this controller's own rules) and\nare never served directly from public storage — every download goes\nthrough the authorization check in TicketAttachmentPolicy, which\nalso denies customers access to a file attached to an internal note."
  -
    name: Categories
    description: "\nTicket categories and subcategories. A \"subcategory\" is simply another\nrow with parent_id set — see the architecture docs for why this\nreplaces a separate child-categories table."
  -
    name: Statuses
    description: "\nThe seven built-in statuses (Open, In Progress, Pending, Escalated,\nResolved, Closed, Reopened) drive the ticket status workflow (see\ndocs/ticket-workflow.md) and are matched by slug, not id — additional\nstatuses can be added here for labeling/reporting but will not\nautomatically participate in transition validation."
  -
    name: Priorities
    description: "\nTicket priorities. `level` is a numeric ordering used by routing\nrules and reporting (higher = more urgent)."
  -
    name: Routing
    description: "\nTicket routing rules, evaluated in `priority` order (lowest first)\nagainst every newly-created ticket. See docs/routing.md for the full\ncondition/action schema and worked examples."
  -
    name: SLA
    description: "\nSLA policies define first-response and resolution deadlines. The\nmost specific match wins when a ticket's SLA is calculated: priority\n+ department, falling back to a department-less default for that\npriority — see CalculateSlaAction and docs/ticket-workflow.md."
  -
    name: Notifications
    description: "\nEvery user manages their own notification preferences — there is no\nadmin override of another user's preferences, since they describe a\npersonal inbox choice, not a permission."
  -
    name: Reports
    description: "\nAggregate reporting. These run live queries rather than against a\npre-aggregated table — acceptable at the data volumes a support\ndesk accumulates, but the first thing to revisit if that changes."
  -
    name: 'Audit Logs'
    description: "\nSystem-wide, read-only audit trail. Distinct from a ticket's own\nactivity feed (GET /tickets/{ticket}/activities) — this covers every\nauditable action across the whole application for compliance review:\nlogin, ticket create/assign/status-change, customer/user creation,\nrole changes, API credential and webhook lifecycle events, and\nplatform-admin tenant actions. There is currently no billing-change\nendpoint for a platform admin to alter an existing tenant's\nsubscription/plan, so that action from section 42 has nothing to log\nyet."
  -
    name: Settings
    description: "\nSystem-wide configuration key/value pairs. Anyone authenticated can\nread the subset marked is_public (e.g. a \"support hours\" display\nstring); the full set, and all writes, require settings.manage."
  -
    name: 'API Credentials'
    description: "\nKey+secret pairs a tenant issues to its own backend/CRM/chat widget\nto call the Integration API (see docs under \"Integration API —\nCustomers/Tickets\"). Scoped to the caller's own tenant like\neverything else here; a credential's secret is only ever visible in\nthe response to the single store()/rotate() call that generated it."
  -
    name: Billing
    description: "\nA tenant's own view of its subscription — distinct from\nPlatform\\TenantController, which lets a platform administrator see\nevery tenant's subscription. Moving to a paid plan issues an invoice\nwith a Razorpay order; the subscription is activated when that invoice\nis paid (see InvoiceController and MarkInvoicePaidAction)."
  -
    name: 'Email to ticket'
    description: "\nLets a workspace turn emails sent to its support address into tickets. The\nworkspace forwards its mailbox (for example support@example.com) to the address\nshown here; see docs/email-to-ticket.md."
  -
    name: Endpoints
    description: ''
  -
    name: Exports
    description: "\nCSV downloads of a workspace's own data, for spreadsheets, backups and moving elsewhere.\nBoth stream row by row, so a large workspace does not run out of memory."
  -
    name: 'Integration API — Customers'
    description: "\nAuthenticated via X-Api-Key / X-Api-Secret headers (see\nResolveIntegrationTenantContext), not a Sanctum session — for a\ntenant's own backend, CRM or chat widget to keep its customer\nrecords in sync with this helpdesk. Every endpoint here is scoped to\nthe credential's own tenant; there is no cross-tenant visibility no\nmatter what id is requested."
  -
    name: 'Integration API — Lookups'
    description: "\nThe ids a client site needs to fill its \"new ticket\" form (priority,\ndepartment, category dropdowns). Read-only, scoped to the credential's own\ntenant, and only active departments/categories are returned. Requires the\ntickets.create scope — these exist to build create-ticket requests."
  -
    name: 'Integration API — Tickets'
    description: "\nSame credential-based auth as the Customers integration endpoints.\n\"Reply\" and \"attachment\" actions here are posted on behalf of the\nticket's customer — there is no staff Sanctum session backing this\ncredential, so there is no agent identity to attribute them to; use\nthe regular Sanctum-authenticated ticket endpoints for agent-side\nactions."
  -
    name: 'Membership Plans'
    description: "\nPublic plan catalog for the pricing page and tenant registration's\n`plan` field — unauthenticated, read-only, mirrors the public\n/tenants/register and /tenants/lookup/{slug} endpoints. Only active\nplans are listed; platform administrators manage the full catalog\n(including inactive/retired plans) via Platform\\MembershipPlanController."
  -
    name: 'Platform Administration'
    description: "\nA single-call overview for the platform admin landing screen —\neverything here is a cheap count query, not a report; GET\n/platform/tenants already supports filtering/pagination for\nanything needing the underlying rows."
  -
    name: 'Tenant Registration'
    description: "\nSelf-service signup for a brand-new organization, distinct from\n/auth/register (which adds a Customer to an *existing* tenant's\nhelpdesk). This flow creates the tenant itself, its first\nsubscription and its first user — the Tenant Owner, who lands with\nthe full-access \"Administrator\" role for that tenant only."
  -
    name: 'Ticket Tags'
    description: "\nFree-form labels agents put on tickets (\"vip\", \"refund\", \"bug\") to group and\nfilter them. Staff only: customers can see tags on their tickets' staff views\nnowhere and cannot set them."
  -
    name: 'Two-factor authentication'
    description: "\nLets a signed-in person protect their own account with an authenticator app\n(Google Authenticator, Microsoft Authenticator, 1Password, Authy…). Every step\nasks for the current password again, so a stolen session token alone can't\nswitch protection on or off. Wrong passwords and wrong codes here count toward\nthe same lockout as at sign-in."
  -
    name: Webhooks
    description: "\nTenant-configured HTTP callbacks for ticket lifecycle events (see\nWebhook::EVENTS). Every delivery is signed with the webhook's own\nsecret via an X-Webhook-Signature header (HMAC-SHA256 of the raw\nJSON body) so the receiving endpoint can verify it actually came\nfrom this platform."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token from `POST /api/v1/auth/login` or `POST /api/v1/auth/register`, then send it as `Authorization: Bearer {token}` on every subsequent request.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register (customer self-service)'
      operationId: registercustomerSelfService
      description: "Creates a new Customer-role account and an associated customer\nprofile, then returns a Bearer token. A verification email is\nqueued automatically."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Registration successful.'
                  data:
                    user:
                      id: 42
                      name: 'Jamie Rivera'
                      email: jamie@example.com
                      roles:
                        - Customer
                    token: 1|abcdef123456...
                    token_type: Bearer
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Registration successful.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 42
                          name:
                            type: string
                            example: 'Jamie Rivera'
                          email:
                            type: string
                            example: jamie@example.com
                          roles:
                            type: array
                            example:
                              - Customer
                            items:
                              type: string
                      token:
                        type: string
                        example: 1|abcdef123456...
                      token_type:
                        type: string
                        example: Bearer
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant:
                  type: string
                  description: "The organization's slug, confirmable via GET /tenants/lookup/{slug}."
                  example: help-support
                name:
                  type: string
                  description: "The user's full name."
                  example: 'Jamie Rivera'
                email:
                  type: string
                  description: 'Unique within this tenant (the same email may register with a different tenant separately).'
                  example: jamie@example.com
                password:
                  type: string
                  description: 'Minimum 10 characters, including upper and lower case, a number, and a symbol.'
                  example: Secret123!word$9
                phone:
                  type: string
                  description: "The user's phone number."
                  example: +1-555-0100
                  nullable: true
                company_name:
                  type: string
                  description: 'Optional company name for business customers.'
                  example: 'Help Corp'
                  nullable: true
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: Secret123!
              required:
                - tenant
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: "Exchanges email/password credentials for a Sanctum Bearer token.\nPass a `device_name` so multiple tokens (web, iOS, Android) can be\nmanaged and revoked independently per device."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Login successful.'
                  data:
                    user:
                      id: 1
                      name: 'System Administrator'
                      email: admin@desknu.test
                      roles:
                        - Administrator
                    token: 1|abcdef123456...
                    token_type: Bearer
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Login successful.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'System Administrator'
                          email:
                            type: string
                            example: admin@desknu.test
                          roles:
                            type: array
                            example:
                              - Administrator
                            items:
                              type: string
                      token:
                        type: string
                        example: 1|abcdef123456...
                      token_type:
                        type: string
                        example: Bearer
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'This account has been deactivated.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'This account has been deactivated.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    email:
                      - 'The provided credentials are incorrect.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The provided credentials are incorrect.'
                        items:
                          type: string
        423:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Too many failed sign-in attempts. This account is locked for another 15 minutes.'
                  retry_after_seconds: 900
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Too many failed sign-in attempts. This account is locked for another 15 minutes.'
                  retry_after_seconds:
                    type: integer
                    example: 900
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: admin@desknu.test
                password:
                  type: string
                  description: ''
                  example: password
                tenant:
                  type: string
                  description: 'Disambiguates if this email has accounts with more than one tenant.'
                  example: help-support
                device_name:
                  type: string
                  description: 'Identifies the issued token, e.g. "iphone-15".'
                  example: web-browser
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/two-factor/challenge:
    post:
      summary: 'Complete a two-factor sign-in'
      operationId: completeATwoFactorSignIn
      description: "Second step of `/auth/login` for an account that has two-factor authentication\non. Send the `challenge_token` from the login response plus either the 6-digit\ncode from the authenticator app (`code`) or one unused recovery code\n(`recovery_code`). Wrong codes count toward the same lockout as wrong passwords."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Login successful.'
                  data:
                    user:
                      id: 1
                    token: 1|abc...
                    token_type: Bearer
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Login successful.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                      token:
                        type: string
                        example: 1|abc...
                      token_type:
                        type: string
                        example: Bearer
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    code:
                      - 'The code is incorrect or has expired.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      code:
                        type: array
                        example:
                          - 'The code is incorrect or has expired.'
                        items:
                          type: string
        423:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Too many failed sign-in attempts. This account is locked for another 15 minutes.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Too many failed sign-in attempts. This account is locked for another 15 minutes.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                  description: 'From the login response.'
                  example: Zk3...
                code:
                  type: string
                  description: 'The 6-digit code.'
                  example: '123456'
                  nullable: true
                recovery_code:
                  type: string
                  description: 'One of the recovery codes, instead of `code`.'
                  example: ab12c-d34ef
                  nullable: true
              required:
                - challenge_token
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Forgot password'
      operationId: forgotPassword
      description: "Sends a password reset link to the given email if an account\nexists for it. Always returns the same generic success message\nregardless of whether the email is registered, to avoid leaking\nwhich addresses have accounts."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'If an account exists for that email, a password reset link has been sent.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'If an account exists for that email, a password reset link has been sent.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: admin@desknu.test
                tenant:
                  type: string
                  description: 'Disambiguates if this email has accounts with more than one tenant — strongly recommended whenever it might, since omitting it resolves to whichever account matches first.'
                  example: help-support
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: "Completes a password reset using the token emailed by\n/auth/forgot-password."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Password has been reset successfully.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Password has been reset successfully.'
                  data:
                    type: string
                    example: null
                    nullable: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    email:
                      - 'This password reset token is invalid or has expired.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'This password reset token is invalid or has expired.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The token from the reset email.'
                  example: 9f8e7d6c5b4a
                email:
                  type: string
                  description: ''
                  example: admin@desknu.test
                tenant:
                  type: string
                  description: 'Same disambiguator as /auth/forgot-password — pass it if it was used there.'
                  example: help-support
                password:
                  type: string
                  description: 'Minimum 10 characters, including upper and lower case, a number, and a symbol.'
                  example: NewSecret123!word$9
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: NewSecret123!
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  '/api/v1/auth/email/verify/{id}/{hash}':
    get:
      summary: 'Verify email'
      operationId: verifyEmail
      description: "Consumes the signed link from the verification email. `id` and\n`hash` come from that link and are not meant to be constructed\nby hand."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Email verified successfully.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Email verified successfully.'
                  data:
                    type: string
                    example: null
                    nullable: true
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid verification link.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid verification link.'
      tags:
        - Authentication
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The user id from the verification link.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: hash
        description: "The sha1 hash of the user's email from the verification link."
        example: 5f4dcc3b5aa765d61d8327deb882cf99
        required: true
        schema:
          type: string
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: "Revokes the Bearer token used to make this request. Other tokens\nissued to the same user (other devices) remain valid."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Logged out successfully.'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Logged out successfully.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentication
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: "Returns the authenticated user's profile, roles, permissions and\n(for customers) their customer profile."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Request successful.'
                  data:
                    id: 1
                    name: 'System Administrator'
                    email: admin@desknu.test
                    roles:
                      - Administrator
                    permissions:
                      - tickets.view
                      - ...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Request successful.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'System Administrator'
                      email:
                        type: string
                        example: admin@desknu.test
                      roles:
                        type: array
                        example:
                          - Administrator
                        items:
                          type: string
                      permissions:
                        type: array
                        example:
                          - tickets.view
                          - ...
                        items:
                          type: string
      tags:
        - Authentication
  /api/v1/auth/email/verification-notification:
    post:
      summary: 'Resend email verification'
      operationId: resendEmailVerification
      description: "Resends the verification email if the authenticated user's address\nis not yet verified."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: ''
                    type: object
                    example:
                      success: true
                      message: 'Verification link sent.'
                      data: null
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: 'Verification link sent.'
                      data:
                        type: string
                        example: null
                        nullable: true
                  -
                    description: ''
                    type: object
                    example:
                      success: true
                      message: 'Email already verified.'
                      data: null
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: 'Email already verified.'
                      data:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Authentication
  /api/v1/users:
    get:
      summary: 'List users'
