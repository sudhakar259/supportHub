  /api/v1/subscription:
    get:
      summary: 'Get the current subscription'
      operationId: getTheCurrentSubscription
      description: "Includes a `usage` block (one entry per plan-limited feature)\ncomputed live via PlanLimitService — the same service every\nresource-creating controller already uses to enforce limits, so\nthis can never drift from what creation actually allows."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Request successful.'
                  data:
                    id: 1
                    status: trial
                    plan:
                      name: Starter
                    usage:
                      users:
                        used: 2
                        limit: 3
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Request successful.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: trial
                      plan:
                        type: object
                        properties:
                          name:
                            type: string
                            example: Starter
                      usage:
                        type: object
                        properties:
                          users:
                            type: object
                            properties:
                              used:
                                type: integer
                                example: 2
                              limit:
                                type: integer
                                example: 3
      tags:
        - Billing
    put:
      summary: 'Change plan'
      operationId: changePlan
      description: "A free plan activates immediately. A paid plan starts a 14-day\ntrial and issues an invoice for the plan price, with a Razorpay\norder to pay it; the subscription is activated once the invoice is\npaid. A lapsed subscription (past_due, suspended or expired) gets no\nnew trial and keeps its lapsed status until that invoice is paid.\nEarlier unpaid invoices are voided. If the payment provider\ncannot create the order, nothing changes and the request returns 503."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Plan updated successfully.'
                  data:
                    status: trial
                    plan:
                      slug: professional
                    invoice:
                      status: pending
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Plan updated successfully.'
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: trial
                      plan:
                        type: object
                        properties:
                          slug:
                            type: string
                            example: professional
                      invoice:
                        type: object
                        properties:
                          status:
                            type: string
                            example: pending
      tags:
        - Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  description: 'The membership plan slug to switch to.'
                  example: professional
              required:
                - plan
