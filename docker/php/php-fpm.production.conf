; Process pool for the production image. Size pm.max_children to the server's memory:
; each worker needs roughly 40-60 MB, so 12 fits comfortably on a 4 GB machine alongside
; the queue worker, Redis and nginx. Override with PHP_FPM_MAX_CHILDREN.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers now and then so a slow memory leak can't grow forever.
pm.max_requests = 500
