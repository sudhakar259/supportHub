; upload_max_filesize is per-file, kept a little above the application's
; 25MB attachment limit (see TicketAttachmentController /
; StoreTicketMessageRequest) so an oversized file reaches Laravel's own
; validation and gets a clean 422 JSON response, instead of being rejected
; by the PHP engine itself with a raw HTML warning under an HTTP 200.
upload_max_filesize = 30M
; post_max_size covers the whole request body, including the message
; endpoint's up-to-5-attachments-per-request path (5 x 25MB) plus
; multipart framing overhead.
post_max_size = 140M
; PHP warnings printed to the response body go out before Laravel sends its
; headers, so the JSON status code and Content-Type are silently replaced by
; PHP's default 200 text/html. Log them to stderr instead.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
date.timezone = UTC
