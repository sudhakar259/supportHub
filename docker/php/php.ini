; The application limits an attachment to 2 MB (config/attachments.php). These are set well
; above that on purpose, so an oversized file reaches Laravel's validation and gets a clean
; JSON 422 instead of being cut off by the PHP engine with an HTML warning under an HTTP 200.
upload_max_filesize = 30M
; The whole request body. Also has to fit an email Mailgun forwards (its own limit is about
; 25 MB): if PHP rejected one, Mailgun would retry it for hours and the email would be lost.
post_max_size = 64M
; PHP warnings printed to the response body go out before Laravel sends its
; headers, so the JSON status code and Content-Type are silently replaced by
; PHP's default 200 text/html. Log them to stderr instead.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
date.timezone = UTC
