# API web server for production. TLS is terminated by the load balancer in front of this
# (see docs/aws-deployment.md), so this listens on plain HTTP inside the private network
# and passes the balancer's X-Forwarded-* headers straight through to PHP.

server_tokens off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Public branding assets are static; application routes fall through to index.php.
    index index.html index.php;

    # Above php.ini's post_max_size (64M) so an oversized request reaches PHP/Laravel and
    # gets a clean JSON error instead of nginx's HTML one.
    client_max_body_size 70M;
    error_page 413 = @payload_too_large;

    # Security headers (X-Frame-Options and the rest) are set by the API itself
    # (SecurityHeaders middleware); nginx must not add duplicates.

    # Documentation is private even if an old build leaves files in public/docs.
    location = /docs { return 404; }
    location ^~ /docs/ { return 404; }
    location = /docs.openapi { return 404; }
    location = /docs.postman { return 404; }

    # Static public assets and Laravel routes.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"message":"The uploaded content is too large. Attachments are limited to 2 MB per file."}';
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
