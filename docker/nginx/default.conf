server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    # Kept above php.ini's post_max_size (see docker/php/php.ini) so a
    # too-large request reaches PHP/Laravel for a clean JSON 422 instead of
    # being cut off here with nginx's default (HTML) error page.
    client_max_body_size 140M;
    error_page 413 = @payload_too_large;

    # X-Frame-Options, X-Content-Type-Options and the rest of the hardening headers
    # are set by the API (SecurityHeaders middleware); nginx must not add duplicates.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"message":"The uploaded content is too large. Attachments are limited to 25 MB per file."}';
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
