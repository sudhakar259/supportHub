name: supporthub

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: supporthub-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    env_file:
      - ./api/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - supporthub

  nginx:
    image: nginx:1.27-alpine
    container_name: supporthub-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - supporthub

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: supporthub-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    env_file:
      - ./api/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work redis --queue=default,notifications,reports --tries=3 --backoff=5 --sleep=3 --max-time=3600
    networks:
      - supporthub

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: supporthub-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    env_file:
      - ./api/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    networks:
      - supporthub

  mysql:
    image: mysql:8.0
    container_name: supporthub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-supporthub}
      MYSQL_USER: ${DB_USERNAME:-supporthub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - supporthub-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supporthub

  redis:
    image: redis:7-alpine
    container_name: supporthub-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - supporthub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supporthub

  mailpit:
    image: axllent/mailpit:latest
    container_name: supporthub-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - supporthub

networks:
  supporthub:
    driver: bridge

volumes:
  supporthub-mysql:
    driver: local
  supporthub-redis:
    driver: local
